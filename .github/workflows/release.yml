name: Test and release
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: items-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    name: Paper 26.1.2 / Java 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set commit version
        run: mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="1.0.${GITHUB_RUN_NUMBER}" -DgenerateBackupPoms=false
      - name: Compile and unit tests
        run: mvn -B -ntp clean verify dependency:build-classpath -Dmdep.outputFile=target/test-classpath.txt
      - name: Packaged plugin in real Paper with controlled integration fixtures
        run: python3 scripts/smoke.py "target/planetry-items-1.0.${GITHUB_RUN_NUMBER}.jar"
      - name: Packaged plugin without optional integrations
        run: python3 scripts/smoke.py "target/planetry-items-1.0.${GITHUB_RUN_NUMBER}.jar" --without-hooks
      - name: Proxy definitions, first sync and cached restart in real Paper
        run: python3 scripts/sync-smoke.py "target/planetry-items-1.0.${GITHUB_RUN_NUMBER}.jar"
      - name: Checksum tested artifact
        run: |
          mkdir -p target/release
          cp "target/planetry-items-1.0.${GITHUB_RUN_NUMBER}.jar" target/release/
          cd target/release
          sha256sum *.jar > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: planetry-items-${{ github.run_number }}
          path: target/release
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: planetry-items-${{ github.run_number }}
          path: target
      - name: Verify tested artifact checksum
        working-directory: target
        run: sha256sum -c SHA256SUMS
      - name: Publish exact tested commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "PlanetryItems 1.0.${GITHUB_RUN_NUMBER}" --prerelease --generate-notes
          fi
          gh release upload "$tag" target/planetry-items-*.jar target/SHA256SUMS --clobber
